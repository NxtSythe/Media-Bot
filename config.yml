# ============================================================
#  متن چنل اینفو
# ============================================================
info_message:
  title: "درود مدیای عزیز، خوش اومدی!"
  description: |
    قبل از اینکه شروع کنی، لطفاً این چند خط رو با دقت بخون تا بدونی کارمون چطوری پیش می‌ره.

    **استریمرها**
    **۱.** هر هفته باید حداقل **۲ تا ۴ استریم** از سرور داشته باشی.
    **۲.** هر استریم حداقل باید **۲ ساعت** طول بکشه.
    **۳.** به‌عنوان مدیای سرور، چه توی استریم چه توی خود سرور، **توهین به پلیرها و استفاده از الفاظ رکیک ممنوعه.**

    **کانتنت کریتورها**
    **۱.** هر ماه باید حداقل **۴ ویدیو** از سرور بسازی.
    **۲.** هر ویدیو حداقل باید **۸ دقیقه** باشه.
    **۳.** به‌عنوان مدیای سرور، چه توی ویدیو چه توی خود سرور، **توهین به پلیرها و استفاده از الفاظ رکیک ممنوعه.**

    یادت نره اسم سرور (**LunaMC**) رو توی عنوان یا توضیحات استریم و ویدیوهات بنویسی.

    اگه هر کدوم از این قوانین رعایت نشه، **دیموت** می‌شی.

    اگه همه‌چیز اوکیه، دکمه‌ی پایین رو بزن و بریم که شروع کنیم!
  button: "قوانین رو خوندم و قبول دارم"
  welcome: "خوش اومدی به تیم مدیای سرور! حالا به بقیه‌ی چنل‌ها دسترسی داری."
