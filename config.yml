# ============================================================
#  LunaMC Media Bot - تنظیمات
#  همه‌ی آیدی‌ها رو با Developer Mode دیسکورد کپی کن
#  (راست کلیک روی چنل/رول ← Copy ID)
# ============================================================

bot:
  # روی گیت‌هاب توکن رو اینجا ننویس! اون رو توی Secrets با اسم DISCORD_TOKEN بذار.
  token: "توکن_بات_رو_اینجا_بذار"
  guild_id: 1567198350669910158

youtube:
  # اختیاریه! بدون API Key هم یوتیوب کار می‌کنه (از صفحه‌های عمومی یوتیوب).
  # اگه یه روز یوتیوب سرورت رو محدود کرد، با گذاشتن API Key دقیق‌تر کار می‌کنه.
  api_key: ""
  check_live_page: true

# اسم سرور که توی پیام‌ها نشون داده می‌شه
server_name: "LunaMC"

# اگه یکی از این کلمه‌ها توی عنوان یا توضیحات استریم/ویدیو باشه، خودکار «مربوط به سرور» حساب می‌شه.
# فاصله، خط تیره، نقطه، # و بزرگی/کوچیکی حروف مهم نیست (LunaMC = luna mc = Luna-MC = #lunamc)
server_keywords:
  - "LunaMC"
  - "لونا ام سی"
  - "لونا امسی"
  - "لوناام‌سی"
  - "لونا MC"

channels:
  info: 1567199367582982234
  live_history: 1567203104133222532
  video_history: 1567203143106691132
  media_dt: 1567203198505189506
  log: 1567203250833195179

roles:
  new: 1567199481424773181
  media: 1567199531127414915

# قوانین فعالیت (برای گزارش ماهانه)
rules:
  streamer:
    min_streams_per_week: 2
    min_stream_minutes: 120
  creator:
    min_videos_per_month: 4
    min_video_minutes: 8

# زمان ارسال خودکار گزارش ماهانه (تاریخ شمسی، ساعت تهران)
report:
  day: 1                 # روز چندم ماه شمسی
  hour: 10               # ساعت چند

intervals:
  live_check_minutes: 3            # هر چند دقیقه لایوهای یوتیوب چک بشن
  aparat_live_check_seconds: 120   # هر چند ثانیه لایوهای آپارات چک بشن (لایوهای کوتاه‌تر هم از روی زمان سشن پیدا می‌شن)
  video_check_minutes: 10          # هر چند دقیقه ویدیوهای جدید آپارات چک بشن
  views_update_hours: 24           # ویوی ویدیوها هر چند ساعت آپدیت بشه
  aparat_end_grace_minutes: 3      # اگه لایو آپارات قطع و وصل شد، تا این مدت همون استریم حساب می‌شه

# ویوی ویدیوها تا چند روز بعد از آپلود آپدیت بشه؟ (0 = همیشه)
views_update_max_days: 0

timezone: "Asia/Tehran"
database: "data.db"

# آدرس‌های API آپارات. بات به ترتیب امتحانشون می‌کنه و اولی که جواب بده رو استفاده می‌کنه.
# فقط وقتی دست بزن که بهت گفتم؛ اگه خالی بمونن مقدارهای پیش‌فرض استفاده می‌شن.
aparat:
  # اگه آپارات سرورت رو بلاک کرده بود، یه پراکسی HTTP روی یه سرور ایرانی اینجا بذار:
  # proxy: "http://user:pass@1.2.3.4:3128"
  proxy: ""
  live: []
  user_videos: []
  video: []
  profile: []

